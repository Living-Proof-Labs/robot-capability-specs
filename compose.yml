# SPDX-License-Identifier: Apache-2.0
services:
  tooling:
    build:
      context: .
      secrets:
        - ca
    environment:
      MANUAL_VERSION: "${MANUAL_VERSION:-}"
      MANUAL_RUN_ID: "${MANUAL_RUN_ID:-}"
      MANUAL_RUN_ATTEMPT: "${MANUAL_RUN_ATTEMPT:-}"
      PR_TITLE: "${PR_TITLE:-chore: branch preview}"
    volumes:
      - ./artifacts:/work/artifacts
secrets:
  ca:
    file: ${HOST_BUILD_CA_FILE:-./tools/empty-ca.pem}
