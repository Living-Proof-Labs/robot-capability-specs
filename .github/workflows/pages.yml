# SPDX-License-Identifier: Apache-2.0
name: Publish manual
on:
  workflow_call:
    inputs:
      release_tag:
        required: true
        type: string
      release_version:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag (vX.Y.Z) to build and deploy
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  version:
    permissions:
      contents: read
    uses: Living-Proof-Labs/collaboration-guidelines/.github/workflows/semantic-release-candidate.yml@v9.9.1
    with:
      replay-tag: ${{ inputs.release_tag || '' }}
  build:
    # Local Docker build fallback until published catalog tooling is available:
    # https://github.com/Living-Proof-Labs/robot-capability-specs/issues/78
    needs: version
    outputs:
      artifact-version: ${{ steps.seal.outputs.version }}
      artifact-commit: ${{ steps.seal.outputs.commit }}
      artifact-run-id: ${{ steps.seal.outputs.run-id }}
      artifact-attempt: ${{ steps.seal.outputs.attempt }}
    if: github.ref == 'refs/heads/main' && inputs.release_tag != ''
    runs-on: ubuntu-24.04
    env:
      RELEASE_TAG: ${{ inputs.release_tag }}
      RELEASE_VERSION: ${{ inputs.release_version || needs.version.outputs.semver-version }}
      CANDIDATE_COMMIT: ${{ needs.version.outputs.commit }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
        with:
          version: '3.54.0'
      - run: task verify
      - name: Seal manual artifact identity
        id: seal
        env:
          EXPECTED_COMMIT: ${{ needs.version.outputs.commit }}
          EXPECTED_VERSION: ${{ needs.version.outputs.semver-version }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_COMMIT"
          echo "version=$EXPECTED_VERSION" >> "$GITHUB_OUTPUT"
          echo "commit=$EXPECTED_COMMIT" >> "$GITHUB_OUTPUT"
          echo "run-id=$GITHUB_RUN_ID" >> "$GITHUB_OUTPUT"
          echo "attempt=$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
      - name: Individual catalog and manual test results
        id: results
        if: ${{ !cancelled() }}
        uses: dorny/test-reporter@dc3a92680fcc15842eef52e8c4606ea7ce6bd3f3 # v2.1.1
        with:
          name: Catalog and manual expectations
          path: artifacts/**/tests.xml
          reporter: java-junit
          use-actions-summary: 'true'
          list-tests: all
          fail-on-error: 'true'
          fail-on-empty: 'true'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        id: artifact
        if: ${{ !cancelled() }}
        with:
          name: manual-verification-${{ github.run_attempt }}
          path: artifacts/
          retention-days: 14
          if-no-files-found: error

      - name: Confirm complete result publication
        if: ${{ !cancelled() }}
        env:
          ARTIFACT_URL: ${{ steps.artifact.outputs.artifact-url }}
          PASSED: ${{ steps.results.outputs.passed }}
          FAILED: ${{ steps.results.outputs.failed }}
          SKIPPED: ${{ steps.results.outputs.skipped }}
        run: python3 tooling/check-publication.py
  deploy:
    # Provider-only Pages deployment; project verification runs in the build job.
    needs: [version, build]
    if: >-
      !cancelled() && github.ref == 'refs/heads/main' &&
      needs.version.result == 'success' && needs.build.result == 'success' &&
      needs.build.outputs.artifact-run-id == github.run_id &&
      needs.build.outputs.artifact-attempt == github.run_attempt
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
      contents: read
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Confirm this run still describes current main
        id: freshness
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          current=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq .object.sha)
          if [ "$current" = "$GITHUB_SHA" ]; then
            echo 'current=true' >> "$GITHUB_OUTPUT"
          else
            echo 'Superseded source; deployment skipped.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Require exact release tag and artifact match inside deployment lock
        if: steps.freshness.outputs.current == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE: ${{ needs.build.outputs.artifact-commit }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          EXPECTED_VERSION: ${{ inputs.release_version || needs.build.outputs.artifact-version }}
          ARTIFACT_VERSION: ${{ needs.build.outputs.artifact-version }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          test "${RELEASE_TAG#v}" = "$ARTIFACT_VERSION"
          test "$EXPECTED_VERSION" = "$ARTIFACT_VERSION"
          test "$CANDIDATE" = "$GITHUB_SHA"
          tagged=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}" --jq .object.sha)
          test "$tagged" = "$CANDIDATE"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        if: steps.freshness.outputs.current == 'true'
        with:
          name: manual-verification-${{ github.run_attempt }}
          path: verified-manual
      - name: Package verified manual for Pages
        if: steps.freshness.outputs.current == 'true'
        run: |
          tar --dereference --hard-dereference -C verified-manual/manual/html -cf "$RUNNER_TEMP/artifact.tar" .
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: steps.freshness.outputs.current == 'true'
        with:
          name: github-pages-${{ github.run_attempt }}
          path: ${{ runner.temp }}/artifact.tar
          retention-days: 1
          if-no-files-found: error
      - uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
        id: deployment
        if: steps.freshness.outputs.current == 'true'
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
