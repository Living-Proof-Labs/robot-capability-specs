# SPDX-License-Identifier: Apache-2.0
name: Publish verified catalog manual
on:
  workflow_call:
    inputs:
      release_tag:
        required: true
        type: string
      release_version:
        required: true
        type: string
      source_commit:
        required: true
        type: string
      run_id:
        required: true
        type: string
      run_attempt:
        required: true
        type: string
      artifact_id:
        required: true
        type: string
      artifact_digest:
        required: true
        type: string
permissions:
  contents: read
jobs:
  deploy:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify the published release and bound artifact under the Pages lock
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          VERSION: ${{ inputs.release_version }}
          COMMIT: ${{ inputs.source_commit }}
          RUN_ID: ${{ inputs.run_id }}
          ATTEMPT: ${{ inputs.run_attempt }}
          ARTIFACT_ID: ${{ inputs.artifact_id }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          [[ "$ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]
          test "${RELEASE_TAG#v}" = "$VERSION"
          test "$COMMIT" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$COMMIT"
          test "$RUN_ID" = "$GITHUB_RUN_ID"
          test "$ATTEMPT" = "$GITHUB_RUN_ATTEMPT"
          test "$(git rev-parse --verify "refs/tags/${RELEASE_TAG}^{commit}")" = "$COMMIT"
          gh api "repos/${GITHUB_REPOSITORY}/releases/tags/$RELEASE_TAG" |
            python3 -c '
          import json, sys
          release = json.load(sys.stdin)
          published = release.get("published_at") if isinstance(release, dict) else None
          if not (isinstance(published, str) and published
                  and release.get("tag_name") == sys.argv[1]
                  and release.get("draft") is False and release.get("prerelease") is False):
              raise SystemExit("Expected the published stable catalog release for this tag")
          ' "$RELEASE_TAG"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ inputs.artifact_id }}
          merge-multiple: true
          path: ${{ runner.temp }}/verified-manual
      - name: Verify that Pages will publish the already checked bytes
        env:
          DIGEST: ${{ inputs.artifact_digest }}
        shell: bash
        run: |
          [[ "$DIGEST" =~ ^[0-9a-f]{64}$ ]]
          printf '%s  %s\n' "$DIGEST" "$RUNNER_TEMP/verified-manual/artifact.tar" | sha256sum --check
      - name: Confirm this run still describes current main
        id: freshness
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT: ${{ inputs.source_commit }}
        shell: bash
        run: |
          set -euo pipefail
          current=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq .object.sha)
          if [ "$current" = "$COMMIT" ]; then
            echo 'current=true' >> "$GITHUB_OUTPUT"
          else
            echo 'Superseded source; deployment skipped.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
        id: deployment
        if: steps.freshness.outputs.current == 'true'
        with:
          artifact_name: github-pages-${{ inputs.run_attempt }}
