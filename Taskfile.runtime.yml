version: '3'

tasks:
  setup:
    desc: Install locked development dependencies (requires Node.js 24, npm and Git)
    preconditions:
      - sh: node --version
        msg: Install Node.js 24.10+ in the 24.x line before running Task.
      - sh: npm --version
        msg: Install npm before running Task.
      - sh: git --version
        msg: Install Git before running Task.
    cmds:
      - npm ci --ignore-scripts
      - pip install --require-hashes -r requirements-docs.txt

  check:
    desc: Check JavaScript syntax and patch whitespace with native tools
    cmds:
      - for: [tooling/commit-title.mjs, tooling/preview.mjs, test/consumer.test.mjs, test/release-caller.test.mjs, test/result-contract.test.mjs, tooling/compare-results.mjs, test/robot-profiles.test.mjs, test/run-assessment.test.mjs, test/robot-manifest.test.mjs, test/scenario-description.test.mjs, test/scenario-parameters.test.mjs, test/world-layout.test.mjs, tooling/world-layout.mjs, tooling/validate-manifests.mjs]
        cmd: node --check "{{.ITEM}}"
      - git diff --check

  test:
    desc: Run consumer validation and release-caller contract tests
    cmds:
      - mkdir -p artifacts
      - node --test --test-reporter=spec --test-reporter=junit --test-reporter-destination=stdout --test-reporter-destination=artifacts/tests.xml tooling/test-suite.mjs

  validate:manifests:
    desc: Validate robot manifests (default the G1, Go1 and T1 examples) against the schema
    cmds:
      - node tooling/validate-manifests.mjs {{.CLI_ARGS}}

  verify:
    desc: Check syntax/whitespace, then run catalog and manual tests
    cmds:
      - task: check
      - task: validate:manifests
      - task: test
      - task: test:docs
  preview:
    desc: Record exact source preview identity
    cmds:
      - npm run preview

  docs:
    desc: Render repository Markdown and Gherkin as a browsable manual
    cmds:
      - python tooling/manual.py
  test:docs:
    desc: Build and exercise the manual in Chromium, retaining JUnit and screenshots
    cmds:
      - task: docs
      - python -m pytest test/docs -q --junitxml=artifacts/manual/tests.xml
