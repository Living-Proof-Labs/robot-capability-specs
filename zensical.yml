# SPDX-License-Identifier: Apache-2.0
site_name: Robot capability specifications
site_url: https://docs.livingprooflabs.com/robot-capability-specs/
use_directory_urls: false
strict: true
theme:
  name: zensical
  font: false
  palette:
    - media: '(prefers-color-scheme)'
      toggle: {icon: lucide/sun-moon, name: Switch to light mode}
    - media: '(prefers-color-scheme: light)'
      scheme: default
      toggle: {icon: lucide/sun, name: Switch to dark mode}
    - media: '(prefers-color-scheme: dark)'
      scheme: slate
      toggle: {icon: lucide/moon, name: Switch to system preference}
markdown_extensions:
  - tables
  - toc: {permalink: true}
  - pymdownx.superfences
nav:
  - Documentation home: https://docs.livingprooflabs.com/
  - Start here: index.md
  - Guides:
      - Authoring: docs/authoring.md
      - Glossary: docs/glossary.md
  - Reference:
      - Contracts:
          - Scope: specs/index.md
          - Revision 1: specs/v1/index.md
          - Revision 1 examples: specs/v1/reference.feature.md
          - Revision 2: specs/v2/index.md
          - Revision 2 examples: specs/v2/reference.feature.md
          - World contract: specs/worlds/index.md
          - World examples: specs/worlds/reference.feature.md
          - Open hallway world: specs/worlds/hallways.md
          - Hallway examples: specs/worlds/hallways.feature.md
          - Robot and configuration profiles: specs/robots/index.md
          - Walk the hallway scenario: specs/scenarios/walk-hallway/index.md
          - Walk the hallway examples: specs/scenarios/walk-hallway/walk-hallway.feature.md
          - Configuration comparison examples: specs/scenarios/walk-hallway/compare-configurations.feature.md
          - Compatibility matrix: specs/matrix/index.md
          - Matrix examples: specs/matrix/reference.feature.md
      - Tasks: tasks.md
  - Verification: docs/verification.md
  - Contribute: CONTRIBUTING.md
  - Version and source: version.md
  - Source: https://github.com/Living-Proof-Labs/robot-capability-specs
  - Help / report an issue: https://github.com/Living-Proof-Labs/robot-capability-specs/issues
  - License: LICENSE.md
